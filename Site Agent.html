<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Site Agent</title>
<style>
:root{--bg:#f6f5f2;--panel:#fff;--ink:#1d1d1b;--muted:#6b6a65;--line:#e3e1db;--accent:#c4501b;--accent-ink:#fff;--soft:#efece4;--code:#f0eee8;--err:#b3341f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--panel:#1d1d1b;--ink:#ecebe6;--muted:#97958d;--line:#32312e;--accent:#e0733a;--accent-ink:#141413;--soft:#2a2927;--code:#262523;--err:#ef8a76}}
:root[data-theme="dark"]{--bg:#141413;--panel:#1d1d1b;--ink:#ecebe6;--muted:#97958d;--line:#32312e;--accent:#e0733a;--accent-ink:#141413;--soft:#2a2927;--code:#262523;--err:#ef8a76}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);display:grid;grid-template-columns:minmax(320px,400px) 1fr;overflow:hidden}
button,select,textarea{font:inherit;color:inherit}
.chat,.preview{display:flex;flex-direction:column;min-height:0;min-width:0}
.chat{background:var(--panel);border-right:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);min-height:50px;flex-wrap:wrap}
.bar h1{font-size:15px;margin:0;flex:1;font-weight:600}
.btn{border:1px solid var(--line);background:transparent;border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px}
.btn:hover:not(:disabled){background:var(--soft)}
.btn:disabled{opacity:.45;cursor:default}
.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:92%;padding:9px 12px;border-radius:12px;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--soft)}
.msg.assistant{align-self:flex-start;padding-left:0}
.msg code{background:var(--code);padding:1px 5px;border-radius:4px;font-size:13px}
.note{font-size:12.5px;color:var(--muted)}
.note.error{color:var(--err)}
.empty{margin:auto;text-align:center;color:var(--muted);max-width:290px}
.chips{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.chips button{text-align:left;border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px 10px;cursor:pointer;font-size:13px}
.chips button:hover{background:var(--soft)}
form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--bg);max-height:140px}
textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
#send{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:0 16px;cursor:pointer;font-weight:600}
#send.stop{background:var(--ink);color:var(--bg)}
#send:disabled{opacity:.5;cursor:default}
.spacer{flex:1}
.subtabs{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line)}
.chat[data-pane='settings'] #log,.chat[data-pane='settings'] #form{display:none}
.chat[data-pane='chat'] #settings{display:none}
#settings{flex:1;overflow-y:auto;padding:14px 16px 28px;display:flex;flex-direction:column;gap:14px}
#settings h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:8px 0 -6px;font-weight:600}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px}
.field label{font-weight:600}
.field small{color:var(--muted);font-size:12px}
.field select,.field input,.field textarea{width:100%;max-width:none;flex:none;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 9px;font-size:13.5px}
.field textarea{resize:vertical;max-height:none}
.refimg{width:100%;max-width:200px;border-radius:10px;border:1px solid var(--line);display:block}
.check{display:flex;gap:8px;align-items:center;font-size:13.5px}
#settings>.btn{align-self:flex-start}
select{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 8px;font-size:13px;max-width:170px}
.stage{flex:1;min-height:0;display:flex;justify-content:center;padding:12px;overflow:auto;position:relative}
.frame{width:100%;height:100%;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;transition:width .2s}
.frame iframe{width:100%;height:100%;border:0;display:block}
pre#code{margin:0;width:100%;height:100%;overflow:auto;background:var(--code);border-radius:10px;padding:14px;font-size:12.5px;line-height:1.5;white-space:pre}
.ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);text-align:center;padding:20px;pointer-events:none}
.tabs{display:none}
.hide{display:none!important}
@media (max-width:820px){
 body{grid-template-columns:1fr;grid-template-rows:auto 1fr}
 .tabs{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
 .chat{border-right:0}
 body[data-tab="chat"] .preview,body[data-tab="preview"] .chat{display:none}
 .tabs+.chat,.tabs+.chat+.preview{grid-row:2}
}
</style>
</head>
<body data-tab="chat">
<div class="tabs"><button class="btn on" data-tab="chat">Chat</button><button class="btn" data-tab="preview">Preview</button></div>
<section class="chat" data-pane="chat">
  <div class="bar"><h1>Site Agent</h1><button class="btn" id="reset">New project</button></div>
  <div class="subtabs"><button class="btn on" data-pane="chat">Chat</button><button class="btn" data-pane="settings">Parameters</button></div>
  <div id="log"></div>
  <div id="settings"></div>
  <form id="form">
    <textarea id="input" rows="2" placeholder="Describe the site you want, or ask for changes"></textarea>
    <button id="send" type="submit">Send</button>
  </form>
</section>
<section class="preview">
  <div class="bar">
    <select id="files" title="File"></select>
    <button class="btn on" id="m-preview">Preview</button>
    <button class="btn" id="m-code">Code</button>
    <span class="spacer"></span>
    <button class="btn on" data-w="100%">Desktop</button>
    <button class="btn" data-w="768px">Tablet</button>
    <button class="btn" data-w="390px">Mobile</button>
    <button class="btn" id="dl" disabled>Download .zip</button>
  </div>
  <div class="stage">
    <div class="frame" id="frame"><iframe id="view" title="Live preview" sandbox="allow-scripts allow-forms"></iframe></div>
    <pre id="code" class="hide"></pre>
    <div class="ph" id="ph">Your site will appear here.</div>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const $ = s => document.querySelector(s);

const STORE = 'siteagent:v1';

{{ASK}}
- Write ALL needed files in ONE round by calling write_file several times in parallel (index.html plus css/js files). Rewrite whole files when changing them; call read_file first when editing an existing file.
- Keep each file compact (under about {{MAX}} lines) so nothing is cut off.
- Use semantic HTML, responsive layouts, accessible markup and a coherent design system with CSS variables. Make distinctive design choices, not generic template looks.
- Use only relative paths (never start with '/'). No external dependencies except Google Fonts links, which may not load in the preview, so give fonts real fallbacks. No images from URLs; use CSS, inline SVG or emoji.
- Internal links between pages work in the preview.
- After building, reply with a brief summary (2-4 sentences) of what you made and what you assumed.`;

  if (persona) out += '\n\nPersonality: in your chat replies, speak as ' + persona + '. This only affects how you talk to the user (questions, summaries, feedback), never the copy on the site, which follows the tone parameter. Keep replies short.';
  if (p.length) out += '\n\nUser-chosen parameters (apply to every site unless the user says otherwise in chat):\n- ' + p.join('\n- ');
  if (s.refOn && (s.refBrief || '').trim()) out += '\n\nBackground reference: the user supplied a reference image for the background vibe. You cannot see it, so work from this description of it:\n' + s.refBrief.trim() + '\nUse it as the guide for backgrounds and the overall visual vibe, recreating the look with CSS gradients and inline SVG rather than image files.';
  if (s.custom.trim()) out += '\n\nAdditional instructions from the user (follow them, but never break the tool and path rules above):\n' + s.custom.trim();
  return out;
}

const SUGGESTIONS = [
  'A portfolio site for a ceramicist: warm, minimal, with a gallery and contact page',
  'A landing page for a neighbourhood coffee roastery with a menu section',
  'A one-page personal site for a freelance data analyst'
];

// ---------- helpers ----------
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function fmt(t){return esc(t).replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>')}
function scrollLog(){log.scrollTop = log.scrollHeight}
function add(role, text){
  $('#empty')?.remove();
  const d = document.createElement('div');
  d.className = 'msg ' + role; d.innerHTML = fmt(text);
  log.appendChild(d); scrollLog(); return d;
}
function note(text, cls=''){
  const d = document.createElement('div');
  d.className = 'note ' + cls; d.textContent = text;
  log.appendChild(d); scrollLog(); return d;
}
function showEmpty(){
  log.innerHTML = '<div class="empty" id="empty">Describe the website you want and I’ll build it. The preview updates as files are written.<div class="chips"></div></div>';
  const chips = log.querySelector('.chips');
  SUGGESTIONS.forEach(s => {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = s;
    b.onclick = () => { input.value = s; $('#form').requestSubmit(); };
    chips.appendChild(b);
  });
}
function normPath(p){
  p = String(p || '').replace(/\\/g,'/').replace(/^\.?\/+/,'');
  if (!p || p.split('/').includes('..')) throw new Error('Invalid path: ' + p);
  return p;
}
function resolveRel(href, page){
  try { return decodeURIComponent(new URL(href, 'http://x/' + page).pathname.slice(1)); } catch { return null; }
}
function save(){
  try { localStorage.setItem(STORE, JSON.stringify({files, turns, current})); } catch {}
}
function load(){
  try {
    const s = JSON.parse(localStorage.getItem(STORE) || 'null');
    if (s) { files = s.files || {}; turns = s.turns || []; current = s.current || 'index.html'; }
  } catch {}
}

// ---------- preview ----------
const COPY = {
  not_granted:'Claude access was declined for this page, so the agent can’t run.',
  sampling_disabled:'Claude isn’t available on this account.',
  rate_limited:'Too many requests right now. Try again in a little while.',
  session_expired:'Your session expired. Reload and sign in again.',
  refused:'Claude declined that request. Try rewording it.',
  empty_completion:'No response came back. Try a simpler request.',
  prompt_too_large:'The project has grown too large for one request. Start a new project.',
  tools_unavailable:'This viewer can’t run the agent’s file tools.'
};
function buildDoc(page){
  const src = files[page];
  if (src == null) return '';
  const doc = new DOMParser().parseFromString(src, 'text/html');
  const local = h => h && !/^([a-z][a-z0-9+.-]*:|\/\/)/i.test(h);
  doc.querySelectorAll('link[rel~="stylesheet"][href]').forEach(l => {
    const h = l.getAttribute('href'); if (!local(h)) return;
    const f = resolveRel(h, page);
    if (f in files) { const s = doc.createElement('style'); s.textContent = files[f]; l.replaceWith(s); }
  });
  doc.querySelectorAll('script[src]').forEach(sc => {
    const h = sc.getAttribute('src'); if (!local(h)) return;
    const f = resolveRel(h, page);
    if (f in files) { const n = doc.createElement('script'); n.textContent = files[f]; sc.replaceWith(n); }
  });
  doc.querySelectorAll('img[src]').forEach(im => {
    const h = im.getAttribute('src'); if (!local(h)) return;
    const f = resolveRel(h, page);
    if (f in files && /\.svg$/i.test(f)) im.setAttribute('src', 'data:image/svg+xml;utf8,' + encodeURIComponent(files[f]));
  });
  const nav = doc.createElement('script');
  nav.textContent = "document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[href]');if(!a)return;var h=a.getAttribute('href');if(!h||h[0]==='#'||/^([a-z][a-z0-9+.-]*:|\\/\\/)/i.test(h))return;e.preventDefault();parent.postMessage({nav:h.split('#')[0],from:" + JSON.stringify(page) + "},'*')});";
  (doc.body || doc.documentElement).appendChild(nav);
  return '<!DOCTYPE html>' + doc.documentElement.outerHTML;
}
window.addEventListener('message', e => {
  if (e.source !== view.contentWindow || !e.data || typeof e.data.nav !== 'string') return;
  const f = resolveRel(e.data.nav, e.data.from);
  if (f && f in files) { current = f; render(); }
});
function render(){
  const names = Object.keys(files).sort();
  const sel = $('#files');
  sel.innerHTML = names.map(n => `<option>${esc(n)}</option>`).join('');
  if (!(current in files)) current = 'index.html' in files ? 'index.html' : (names.find(n => n.endsWith('.html')) || names[0] || 'index.html');
  sel.value = current;
  $('#dl').disabled = !names.length || !downloads;
  $('#ph').classList.toggle('hide', names.length > 0);
  const isHtml = /\.html?$/i.test(current);
  const showCode = names.length && (mode === 'code' || !isHtml);
  $('#frame').classList.toggle('hide', !!showCode || !names.length);
  $('#code').classList.toggle('hide', !showCode);
  if (showCode) $('#code').textContent = files[current] ?? '';
  else if (names.length) view.srcdoc = buildDoc(current);
}
function scheduleRender(){ clearTimeout(renderTimer); renderTimer = setTimeout(render, 300); }

// ---------- agent ----------
function tools(onWrite){
  return [
    {name:'write_file', description:'Create or overwrite a file in the site. Path is relative, e.g. "index.html" or "css/style.css". Returns a confirmation.',
     inputSchema:{type:'object', properties:{path:{type:'string'}, content:{type:'string', description:'Full file contents'}}, required:['path','content']},
     execute(i){ const p = normPath(i.path); files[p] = String(i.content ?? ''); onWrite(p); return 'Wrote ' + p + ' (' + files[p].length + ' chars)'; }},
    {name:'read_file', description:'Read the full contents of an existing site file.',
     inputSchema:{type:'object', properties:{path:{type:'string'}}, required:['path']},
     execute(i){ const p = normPath(i.path); if (!(p in files)) throw new Error('No such file: ' + p); return files[p]; }},
    {name:'list_files', description:'List all files currently in the site, with sizes.',
     execute(){ return Object.keys(files).sort().map(n => n + ' (' + files[n].length + ' chars)').join('\n') || '(empty)'; }}
  ];
}
function setBusy(b){
  busy = b; sendBtn.textContent = b ? 'Stop' : 'Send'; sendBtn.classList.toggle('stop', b);
  sendBtn.disabled = !sample; input.disabled = false;
}
async function submit(text){
  $('#empty')?.remove();
  add('user', text);
  const status = note('Thinking…');
  let bubble = null, wrote = [];
  ctl = new AbortController(); setBusy(true);
  const listing = Object.keys(files).sort().map(n => n + ' (' + files[n].length + ' chars)').join('\n') || '(none yet)';
  const history = turns.slice(-24);
  const inputTurns = [{role:'user', content: buildRules() + '\n\nCurrent site files:\n' + listing}, ...history, {role:'user', content:text}];
  turns.push({role:'user', content:text});
  let answer = '';
  try {
    const r = await sample(inputTurns, {
      cache:false, signal:ctl.signal, modelTier:settings.tier, ...(settings.effort ? {effort:settings.effort} : {}),
      tools: tools(p => { if (!wrote.includes(p)) wrote.push(p); note('✓ Wrote ' + p); current = /\.html?$/i.test(p) && (!(current in files) || p === 'index.html' || !wrote.includes(current)) ? p : current; scheduleRender(); }),
      onText: ({text:t}) => { status.remove(); if (!bubble) bubble = add('assistant', ''); bubble.innerHTML = fmt(t); answer = t; scrollLog(); }
    });
    answer = r.text;
    if (r.truncated) note('The response was cut short. Ask for the rest in smaller pieces.');
  } catch (e) {
    answer = e.text || answer;
    if (e.code !== 'cancelled') note(COPY[e.code] || 'Something went wrong. You can try again.', 'error');
    if (e.code === 'not_granted' || e.code === 'sampling_disabled' || e.code === 'tools_unavailable') { sample = null; }
  }
  status.remove();
  if (answer.trim() || wrote.length) turns.push({role:'assistant', content:(answer.trim() || 'Done.') + (wrote.length ? '\n[Files written: ' + wrote.join(', ') + ']' : '')});
  else turns.pop();
  ctl = null; setBusy(false); render(); save();
  if (!sample) { sendBtn.disabled = true; input.placeholder = 'Claude access isn’t available in this view.'; }
}

// ---------- events ----------
$('#form').addEventListener('submit', e => {
  e.preventDefault();
  if (busy) { ctl?.abort(); return; }
  const t = input.value.trim();
  if (!t || !sample) return;
  input.value = ''; submit(t);
});
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#form').requestSubmit(); }
});
$('#files').addEventListener('change', e => { current = e.target.value; render(); });
$('#m-preview').onclick = () => { mode = 'preview'; $('#m-preview').classList.add('on'); $('#m-code').classList.remove('on'); render(); };
$('#m-code').onclick = () => { mode = 'code'; $('#m-code').classList.add('on'); $('#m-preview').classList.remove('on'); render(); };
document.querySelectorAll('[data-w]').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('[data-w]').forEach(x => x.classList.toggle('on', x === b));
  $('#frame').style.width = b.dataset.w;
}));
document.querySelectorAll('.tabs [data-tab]').forEach(b => b.addEventListener('click', () => {
  document.body.dataset.tab = b.dataset.tab;
  document.querySelectorAll('.tabs [data-tab]').forEach(x => x.classList.toggle('on', x === b));
}));
$('#reset').addEventListener('click', () => {
  if (busy) return;
  if (!confirm('Clear the conversation and delete all files in this project?')) return;
  files = {}; turns = []; current = 'index.html'; save(); showEmpty(); render();
});
$('#dl').addEventListener('click', async () => {
  if (!downloads || !window.JSZip) { note('Zip download isn’t available in this view.', 'error'); return; }
  try {
    const z = new JSZip();
    Object.keys(files).forEach(n => z.file(n, files[n]));
    const blob = await z.generateAsync({type:'blob'});
    await downloads.save({filename:'site.zip', data:blob});
  } catch (e) {
    if (e && e.code !== 'declined') note('Couldn’t save the zip. You can copy files from the Code view instead.', 'error');
  }
});

document.querySelectorAll('.subtabs [data-pane]').forEach(b => b.addEventListener('click', () => {
  $('.chat').dataset.pane = b.dataset.pane;
  document.querySelectorAll('.subtabs [data-pane]').forEach(x => x.classList.toggle('on', x === b));
  if (b.dataset.pane === 'chat') scrollLog();
}));

// ---------- init ----------
(async () => {
  load(); loadSettings(); buildSettings();
  if (turns.length) {
    turns.forEach(t => add(t.role, t.content.replace(/\n\[Files written:[^\]]*\]$/, '')));
  } else showEmpty();
  render();
  sendBtn.disabled = true;
  try { downloads = await claude.use('downloads'); } catch { downloads = null; }
  try { sample = await claude.use('sample'); } catch { sample = null; }
  if (sample) {
    try { const l = await sample.limits(); if (!l.tools) sample = null; } catch {}
  }
  if (!sample) { input.placeholder = 'Claude access isn’t available in this view.'; note('The agent needs Claude access, which isn’t available here. Open this artifact in claude.ai.', 'error'); }
  sendBtn.disabled = !sample;
  render();
})();
</script>
</body>
</html>
