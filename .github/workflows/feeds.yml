name: Refresh threat feeds
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/fetch-feeds.mjs
      - name: Commit if changed
        run: |
          git config user.name "glorbus-bot"
          git config user.email "glorbus-bot@users.noreply.github.com"
          git add feeds/feed.json
          git diff --cached --quiet || (git commit -m "Refresh feeds" && git push)
